<h3 id="find-out-which-branch-a-commit-took-place-on">Find out which branch a commit took place on<a aria-hidden="true" class="anchor-heading icon-link" href="#find-out-which-branch-a-commit-took-place-on"></a></h3>
<p>If within last 90 days (ie. before gc), check <a title="Private" href="https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html" target="_blank" class="private">reflog (Private)</a></p>
<pre class="language-sh"><code class="language-sh">git reflog show --all | grep d7f32e

git name-rev --name-only d7f32e
</code></pre>
<h3 id="find-all-commits-made-on-a-given-day">Find all commits made on a given day<a aria-hidden="true" class="anchor-heading icon-link" href="#find-all-commits-made-on-a-given-day"></a></h3>
<pre class="language-sh"><code class="language-sh">git reflog --date=iso | grep "2024-09-18"
</code></pre>
