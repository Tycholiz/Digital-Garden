<h1 id="never">Never<a aria-hidden="true" class="anchor-heading icon-link" href="#never"></a></h1>
<p><code>never</code> can be considered as opposite to <code>any</code> type.</p>
<ul>
<li><code>any</code> says give me anything, and <code>never</code> says give me nothing.</li>
</ul>
<p>never is used when we have exhausted all possible value and we don’t have anything to assign.</p>
